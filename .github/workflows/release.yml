name: release

# Syncs GitHub releases from the CHANGELOG file — the single source of
# truth for release titles and notes. For every "## vX.Y.Z — title
# (date)" section: an existing release gets its title/notes updated; a
# missing one is created, tagged at the commit that triggered the run
# (so add one new CHANGELOG entry per release run, and trigger from the
# merge commit that should carry the tag). Manually triggered;
# idempotent. Exists because Claude cloud sessions cannot push tags
# (see AGENT.md "Cloud session notes").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync releases from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tags=$(grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG | awk '{print $2}')
          for tag in $tags; do
            title=$(grep -E "^## $tag( |$)" CHANGELOG | head -1 \
              | sed -E 's/^## //; s/ \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$//')
            awk -v tag="$tag" '
              $0 ~ "^## "tag"( |$)" {found=1; next}
              /^## / {found=0}
              found {print}
            ' CHANGELOG | sed -e '/./,$!d' > /tmp/notes.md
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes-file /tmp/notes.md
              echo "updated $tag from CHANGELOG"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/notes.md
              echo "created $tag at $GITHUB_SHA"
            fi
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build jar
        run: |
          mkdir -p build/classes dist
          javac -d build/classes -sourcepath src/main/java src/main/java/localreceiver/Main.java
          jar --create --file dist/localreceiver.jar --main-class localreceiver.Main -C build/classes . -C src/main/resources .

      - name: Attach jar to the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG | head -1 | awk '{print $2}')
          # Asset naming convention: vX.Y.Z -> localreceiver_vXrYnZ.jar
          asset="localreceiver_$(echo "$newest" | sed -E 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/v\1r\2n\3/').jar"
          cp dist/localreceiver.jar "dist/$asset"
          gh release upload "$newest" "dist/$asset" --clobber
