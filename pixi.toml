[workspace]
authors = ["SotongDJ <sotong0221@gmail.com>"]
channels = ["conda-forge"]
name = "localReceiver"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "1.1.0"

[tasks]
build = { cmd = "mkdir -p build/classes dist && javac -d build/classes -sourcepath src/main/java src/main/java/localreceiver/Main.java && jar --create --file dist/localreceiver.jar --main-class localreceiver.Main -C build/classes . -C src/main/resources ." }
run = { cmd = "java -jar dist/localreceiver.jar", depends-on = ["build"] }
clean = "rm -rf build dist"

[dependencies]
openjdk = ">=25.0.2,<26"
